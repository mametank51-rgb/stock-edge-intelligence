/* ===== v0.8 INSTANT DASHBOARD / CACHE-FIRST MOBILE UI ===== */
:root{--touch:58px}
.v3-dashboard,.v3-ranking,.v3-voice{max-width:1120px;margin:0 auto}
.v3-toolbar{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}
.v3-toolbar h1{font-size:30px;line-height:1.15;letter-spacing:-.8px;margin:4px 0 6px}
.v3-toolbar p{margin:0;color:var(--muted);font-size:13px}
.v3-toolbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.v3-refresh{min-height:52px;border-radius:13px;padding:12px 18px;font-size:14px;font-weight:850;background:var(--accent);color:var(--accent-text);border:1px solid var(--accent)}
.v3-refresh.secondary{background:var(--panel);color:var(--text);border-color:var(--line)}
.v3-live{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 11px;font-size:11px;color:var(--muted)}
.v3-live i{display:block;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.v3-live.working i{animation:pulseDot 1.2s infinite}
@keyframes pulseDot{50%{opacity:.25}}
.v3-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 20px}
.v3-stat{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 16px;min-width:0}
.v3-stat span{display:block;color:var(--muted);font-size:10px;letter-spacing:.5px}
.v3-stat strong{display:block;font-size:22px;line-height:1.1;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v3-stat small{display:block;color:var(--muted);font-size:10px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v3-section{margin:22px 0}
.v3-section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:11px}
.v3-section-head h2{font-size:20px;margin:0 0 3px;letter-spacing:-.3px}
.v3-section-head p{font-size:12px;color:var(--muted);margin:0}
.v3-top-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.v3-pick{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:16px;min-width:0}
.v3-pick:first-child{border-color:color-mix(in srgb,var(--accent) 42%,var(--line));background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 5%,var(--panel)),var(--panel))}
.v3-pick-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.v3-rank{font-size:10px;font-weight:900;color:var(--accent);letter-spacing:1px}
.v3-pick h3{font-size:16px;line-height:1.35;margin:3px 0 1px;overflow-wrap:anywhere}
.v3-code{font-size:10px;color:var(--muted)}
.v3-score{font-size:31px;line-height:1;color:var(--accent);font-weight:750;letter-spacing:-1px}
.v3-score small{font-size:9px;color:var(--muted);letter-spacing:0}
.v3-price{font-size:19px;font-weight:750}
.v3-chips{display:flex;gap:6px;flex-wrap:wrap}
.v3-chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 8px;font-size:10px;color:var(--muted);white-space:nowrap}
.v3-chip.good{border-color:color-mix(in srgb,var(--up) 42%,var(--line));color:var(--up)}
.v3-chip.warn{border-color:color-mix(in srgb,#e9b949 42%,var(--line));color:#e9b949}
.v3-chip.bad{border-color:color-mix(in srgb,var(--down) 42%,var(--line));color:var(--down)}
.v3-note{font-size:11px;color:var(--muted);line-height:1.65;min-height:36px}
.v3-pick .btn{margin-top:auto;width:100%;min-height:48px;border-radius:11px;font-size:13px;font-weight:800}
.v3-empty{border:1px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;color:var(--muted);background:var(--panel)}
.v3-empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.v3-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.v3-flow-item{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:13px}
.v3-flow-no{display:grid;place-items:center;flex:0 0 28px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--accent) 13%,var(--panel2));color:var(--accent);font-weight:900;font-size:12px}
.v3-flow-item strong{display:block;font-size:12px}.v3-flow-item small{display:block;font-size:10px;color:var(--muted);margin-top:2px;line-height:1.5}
.v3-voice-strip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:16px}
.v3-voice-strip-head{display:flex;justify-content:space-between;gap:12px;align-items:center}
.v3-voice-strip-head h2{font-size:17px;margin:0 0 3px}
.v3-voice-strip-head p{font-size:11px;color:var(--muted);margin:0}
.v3-voice-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.v3-voice-mini a{display:block;border:1px solid var(--line);border-radius:11px;padding:11px;background:var(--panel2)}
.v3-voice-mini strong{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v3-voice-mini small{font-size:9px;color:var(--muted)}
.v3-maintenance{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:11px}
.v3-maintenance summary{cursor:pointer;color:var(--text);font-weight:800;padding:6px 0}
.v3-maintenance .head-actions{margin-top:10px;flex-wrap:wrap}
.v3-bg-status{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted);margin-top:8px}
.v3-bg-status .dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.v3-bg-status.working .dot{background:var(--accent);animation:pulseDot 1.2s infinite}
.v3-table-panel{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}
.v3-table-panel .panel-header{padding:14px 16px}
.v3-table-tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin:12px 0}
.v3-table-tools input,.v3-table-tools select{min-height:48px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:10px 12px;font-size:13px}
.v3-voice-status{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}
.v3-voice-primary{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:17px}
.v3-voice-primary h2{font-size:20px;margin:0 0 5px}
.v3-voice-primary p{font-size:12px;color:var(--muted);margin:0}
.v3-feed{display:grid;gap:9px}
.v3-story{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:14px}
.v3-story-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.v3-story h3{font-size:14px;line-height:1.5;margin:9px 0 5px}
.v3-story p{font-size:10px;color:var(--muted);margin:0}
.v3-story-foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:10px;color:var(--muted)}
.v3-story-foot a{color:var(--accent);font-weight:800}
.v3-signal-list{display:grid;gap:8px;margin-top:10px}
.v3-signal{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:11px;padding:11px;background:var(--panel2)}
.v3-signal strong{font-size:12px}.v3-signal small{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.v3-first-frame{max-width:1120px;margin:auto;padding-top:4px}
.v3-first-frame .v3-toolbar{margin-bottom:14px}
.v3-skeleton{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.v3-skeleton>div{height:145px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(90deg,var(--panel),var(--panel2),var(--panel));background-size:220% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{to{background-position:-220% 0}}
@media(max-width:760px){
  main{padding:16px 14px 104px}
  .v3-toolbar{align-items:center;margin-bottom:14px}
  .v3-toolbar h1{font-size:25px;margin-top:2px}
  .v3-toolbar p{font-size:11px;max-width:230px}
  .v3-toolbar-actions{flex:0 0 auto}
  .v3-toolbar-actions .v3-live{display:none}
  .v3-refresh{min-height:50px;padding:11px 14px;font-size:13px;border-radius:12px}
  .v3-summary{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:16px}
  .v3-stat{padding:11px 9px;border-radius:12px;text-align:left}
  .v3-stat span{font-size:8px}.v3-stat strong{font-size:18px}.v3-stat small{font-size:8px;margin-top:4px}
  .v3-section{margin:17px 0}
  .v3-section-head{align-items:center;margin-bottom:9px}
  .v3-section-head h2{font-size:18px}.v3-section-head p{font-size:10px}
  .v3-top-grid{grid-template-columns:1fr;gap:9px}
  .v3-pick{padding:14px;border-radius:14px;gap:10px}
  .v3-pick h3{font-size:15px}.v3-score{font-size:28px}.v3-price{font-size:18px}
  .v3-note{min-height:0}
  .v3-pick .btn{min-height:52px;font-size:14px}
  .v3-flow{grid-template-columns:1fr;gap:7px}.v3-flow-item{padding:11px}
  .v3-voice-strip{padding:14px}.v3-voice-strip-head{align-items:flex-start}.v3-voice-strip-head .btn{min-height:44px;font-size:12px;padding:9px 11px}
  .v3-voice-mini{grid-template-columns:1fr}
  .v3-table-tools{grid-template-columns:1fr}.v3-table-tools input,.v3-table-tools select{font-size:14px}
  .v3-voice-status{grid-template-columns:1fr}
  .v3-first-frame{padding-top:0}.v3-skeleton{grid-template-columns:1fr}.v3-skeleton>div{height:110px}
  .btn{border-radius:11px}
}

.v4-hero{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin:2px 0 20px}

.v4-hero h1{font-size:38px;line-height:1.12;letter-spacing:-1.4px;margin:7px 0 8px}
.v4-hero p{margin:0;color:var(--muted);font-size:15px;line-height:1.7}
.v4-hero-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.v4-status{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 13px;border:1px solid var(--line);border-radius:12px;color:var(--muted);background:var(--panel);font-size:12px;white-space:nowrap}
.v4-status i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 10%,transparent)}
.v4-status.working i{animation:pulse 1.2s infinite}
.v4-update{min-height:46px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--accent-text);font-size:14px;font-weight:800}
.v4-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 22px}
.v4-summary-item{padding:15px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0}
.v4-summary-item span{display:block;font-size:10px;letter-spacing:.9px;color:var(--muted);font-weight:700;margin-bottom:5px}
.v4-summary-item strong{display:block;font-size:19px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v4-summary-item small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.v4-section{margin-top:26px}
.v4-section-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:12px}
.v4-section-head h2{font-size:23px;letter-spacing:-.5px;margin:0 0 2px}
.v4-section-head p{margin:0;color:var(--muted);font-size:13px}
.v4-link{color:var(--accent);font-size:13px;font-weight:750}
.v4-top-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.v4-stock-card{position:relative;background:linear-gradient(155deg,color-mix(in srgb,var(--accent) 4%,var(--panel)),var(--panel));border:1px solid var(--line);border-radius:18px;padding:19px;overflow:hidden;min-width:0}
.v4-stock-card:first-child{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 16px 38px #0002}
.v4-card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}

<script>/* Deterministic research model; scores are not return probabilities. */
(function(root){
'use strict';
const clamp=(x,a=0,b=100)=>Math.max(a,Math.min(b,x));
const aliases={'7203':'トヨタ自動車','6758':'ソニーグループ','9984':'ソフトバンクグループ','9983':'ファーストリテイリング','8035':'東京エレクトロン','6857':'アドバンテスト','6920':'レーザーテック','6501':'日立製作所','8306':'三菱UFJ','8316':'三井住友フィナンシャル','8411':'みずほフィナンシャル','7974':'任天堂','9432':'NTT','9433':'KDDI','9434':'ソフトバンク','4063':'信越化学','6098':'リクルート','6861':'キーエンス','8058':'三菱商事','8001':'伊藤忠','8031':'三井物産','8002':'丸紅','8053':'住友商事','4502':'武田薬品','4519':'中外製薬','4568':'第一三共','7011':'三菱重工','7012':'川崎重工','7013':'IHI','7267':'ホンダ','7269':'スズキ','7201':'日産自動車','6701':'NEC','6702':'富士通','6723':'ルネサス','6526':'ソシオネクスト','6146':'ディスコ','285A':'キオクシア'};
const age=(s,now)=>{const t=Date.parse(s||'');return Number.isFinite(t)&&t<=now+300000?(now-t)/86400000:Infinity;};
function classify(text){
 const up=/買い推奨|買い継続|強気|上方修正|増益|最高益|引き?上げ|格上げ|目標(?:株価|価格)(?:を)?上げ|アウトパフォーム|オーバーウェイト|増配|自社株買い/.test(text);
 const down=/売り推奨|弱気|下方修正|減益|赤字|引き?下げ|格下げ|目標(?:株価|価格)(?:を)?下げ|アンダーパフォーム|アンダーウェイト/.test(text);
 return up===down?'neutral':up?'bullish':'bearish';
}
function relevant(code,company,text){
 if(String(code)==='9434'&&/ソフトバンク(?:グループ|[GＧ])/.test(text)&&!/(^|[^0-9A-Za-z])9434([^0-9A-Za-z]|$)/.test(text))return false;
 const c=String(code).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 const name=String(aliases[String(code)]||company||'').replace(/株式会社|[\s　]/g,'');
 return new RegExp('(^|[^0-9A-Za-z])'+c+'([^0-9A-Za-z]|$)','i').test(text)||(name.length>=2&&text.replace(/[\s　]/g,'').includes(name));
}
function key(p){return String(p.headline||p.raw||'').normalize('NFKC').toLowerCase().replace(/\s|[「」『』【】]/g,'').replace(/\s*-.*$/,'');}
function metric(items,now=Date.now()){
 const unique=new Map();
 for(const p of items){if(age(p.publishedAt,now)>30||age(p.publishedAt,now)<0)continue;const k=key(p);if(k&&!unique.has(k))unique.set(k,p);}
 const sources=new Map();let bull=0,bear=0,neutral=0,total=0,w=0;
 for(const p of unique.values()){
   const source=String(p.sourceGroup||p.publisher||p.author||'不明').trim().toLowerCase();
   const a=sources.get(source)||[];a.push(p);sources.set(source,a);
 }
 for(const group of sources.values())for(const p of group){
   const fresh=Math.pow(.5,age(p.publishedAt,now)/7);
   const quality=p.opinionChannel==='analyst'?.8:p.opinionChannel==='community'||p.opinionChannel==='video'?.35:.5;
   const weight=fresh*quality/group.length;
   const val=p.stance==='bullish'?1:p.stance==='bearish'?-1:0;
   total+=val*weight;w+=weight;val>0?bull++:val<0?bear++:neutral++;
 }
 // Shrink sparse or old evidence toward 50; a source has a capped total influence.
 return {score:w?Math.round(50+42*total/(w+1)):null,count:unique.size,bull,bear,neutral,sources:sources.size,channels:new Set([...unique.values()].map(p=>p.opinionChannel)).size,evidenceWeight:w};
}
function composite({tech,fund,voice,priceDate,fundDate,voiceWeight=0,rsi,atrPct},now=Date.now()){
 const tq=age(priceDate,now)<=7?1:age(priceDate,now)<=14?.4:0;
 const fq=age(fundDate,now)<=550?1:age(fundDate,now)<=730?.4:0;

__modules.evidenceUI = (() => {

function evidencePanel(state) {
  const h=state.history,patterns=state.evidencePatterns||[],selected=patterns.find(p=>p.id===state.evidenceId)||patterns[0];
  const labels={candidate:'候補 / 上抜け未確認',breakout:'終値の上抜けを確認',retest:'上抜け後にネックライン以下へ戻る',invalidated:'否定条件に到達'};
  return `<section class="panel evidence-panel" id="technical-evidence"><div class="panel-header"><div><h2>チャートパターンを確認</h2><p class="panel-subtitle">Technical Labとは別に、形状候補を実際のチャート位置へ描画します。</p></div></div><div class="panel-body"><label class="switch"><input type="checkbox" id="evidence-sma" ${state.showSMA?'checked':''}> 移動平均20本を表示</label><p class="setting-note">移動平均＝当日を含む終値20本の平均。期間不足は描画しません。</p>${h?.interval==='1wk'?'<p>ダブルボトムの検出は日足で行います。日足へ切り替えてください。</p>':patterns.length?`<div class="evidence-choices">${patterns.map((p,i)=>`<button class="btn ${selected?.id===p.id?'primary':''}" data-evidence="${esc(p.id)}">候補${i+1} · ${p.second.time}</button>`).join('')}</div>`:'<div class="placeholder"><strong>条件を満たすダブルボトム候補はありません</strong><p>無理にWを描きません。最低35本の日足が必要で、直近250本を確認します。</p></div>'}
  ${selected&&h?.interval==='1d'?`<div class="evidence-description"><h3>Double Bottom · ${labels[selected.status]}</h3><p><span class="tag">形状評価 ${selected.score}/100</span> 統計的な勝率・上昇確率ではありません。</p><div class="facts"><div class="fact"><span>① 第1の底</span><strong>${selected.first.time} / ${number(selected.first.low)}</strong></div><div class="fact"><span>② 第2の底</span><strong>${selected.second.time} / ${number(selected.second.low)}</strong></div><div class="fact"><span>N 戻り高値 / ネックライン</span><strong>${selected.neck.time} / ${number(selected.neckline)}</strong></div><div class="fact"><span>検出可能になった日（右3本確認）</span><strong>${h.candles[selected.confirmed]?.time||'—'}</strong></div><div class="fact"><span>底の差 / 許容幅</span><strong>${number(selected.bottom_difference)} / ${number(selected.tolerance)}</strong></div><div class="fact"><span>底の間隔</span><strong>${selected.distance} 本</strong></div><div class="fact"><span>ATR14（単純平均）</span><strong>${number(selected.atr)}</strong></div></div><div class="condition-grid"><div><strong>N 成立の条件</strong><p>日足終値 ＞ ${number(selected.neckline+.1*selected.atr)}<br>ネックライン＋0.1×ATR14</p><p>${selected.breakout?'最初に観測：'+selected.breakout.time:'未確認'}</p></div><div><strong>× 否定の条件</strong><p>日足終値 ＜ ${number(selected.invalidation)}<br>安い方の底 −0.5×ATR14</p><p>${selected.invalidated?'最初に観測：'+selected.invalidated.time:'未到達'}</p></div><div><strong>T 条件付き測定値</strong><p>${number(selected.target)}<br>N＋（N−2底の平均）。到達を予測する値ではありません。</p></div></div><p>出来高確認：${selected.volume_ratio===null?'未評価（上抜け未確認または比較20本不足）':number(selected.volume_ratio)+'倍 / 上抜け日の出来高÷直前20本平均（参考基準1.2倍）'}</p></div>`:''}
  <details><summary>検出ルール・限界</summary><p>安値の左右3本から底を確定。底の間隔8〜60本、差はmax(1.5×ATR14, 平均底値の1.5%)以内。戻り幅はmax(2×ATR14, 平均底値の3%)以上。第1底の前10本との下落幅も同基準を必要とします。第2底から40本以内の候補を最大3件表示します。</p><p>形状評価＝底の類似40点＋戻り幅20点＋事前条件20点＋終値上抜け20点。直近の候補を優先します。評価の的中率検証は未実施。未調整・調整不明の価格では分割等により偽の形が生じます。これは学習・確認用の限定的なヒューリスティックです。</p><p>3本後の確認日より前に検出できたと解釈しないでください。全期間の最終時点で計算するため、過去時点のバックテストではありません。</p></details>
  <div class="head-actions" style="margin-top:16px"><button class="btn small" data-action="download-evidence">表示チャートをSVG保存</button><button class="btn small" data-action="copy-evidence">AI相談用の根拠を表示</button></div><div id="svg-export-code"></div><div id="evidence-prompt"></div></div></section>`;
}

__modules.api = (() => {
const STORAGE_KEY = 'stock-edge-html-backend-v1';
function readBackend() {
  try { return HTML_CONTEXT.storage.getItem(STORAGE_KEY) || ''; } catch { return ''; }
}

function normalizeBackend(input) {
  if (!input.trim()) return '';
  const url = new URL(input.trim());
  if (!['http:', 'https:'].includes(url.protocol) || url.username || url.password || url.search || url.hash || url.pathname !== '/') {
    throw new Error('Backend URLには http(s)://ホスト:ポート のみ指定してください。');
  }
  if (location.protocol === 'https:' && url.protocol === 'http:') {
    throw new Error('HTTPSの画面からHTTPのBackendへ接続できません。HTTPSのURLを指定してください。');
  }
  return url.origin;
}

function saveBackend(url) {
  try {
    if (url) HTML_CONTEXT.storage.setItem(STORAGE_KEY, url);
    else HTML_CONTEXT.storage.removeItem(STORAGE_KEY);
  } catch { throw new Error('ブラウザが接続先の保存を拒否しました。保存設定を確認してください。'); }
}

async function request(path, options = {}, backend = readBackend()) {
  if(!backend) {
    const {demoRequest}=__modules.demoApi;
    return demoRequest(path,options);
  }
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);
  try {
    const response = await window.stockEdgeRequest(`${backend}${path}`, {
      ...options, signal: controller.signal,
      credentials: 'omit', cache: 'no-store',
      headers: { ...(options.body ? {'Content-Type': 'application/json'} : {}), ...options.headers },
    });
    const body = await response.json().catch(() => null);
    if (!response.ok) {
      const detail = typeof body?.detail === 'string' ? body.detail : '入力値またはサーバーの状態を確認してください。';
      const error=new Error(`HTTP ${response.status} · ${detail}`);error.status=response.status;error.code=body?.error_code;error.retryAfter=body?.retry_after||Number(response.headers.get("Retry-After"))||null;throw error;
    }
    if (!body) throw new Error('BackendからJSONを取得できませんでした。接続先を確認してください。');
    return body;
  } catch (error) {
    if (error.name === 'AbortError') throw new Error('接続がタイムアウトしました。Backendの起動を確認してください。');
    if (error instanceof TypeError) throw new Error('Backendに接続できません。起動状態・URL・CORS設定を確認してください。');
    throw error;
  } finally { clearTimeout(timer); }
}

async function loadFoundation(backend = readBackend()) {
  const [health, stocks, ranking, watchlist, settings, providers] = await Promise.all([
    request('/health', {}, backend), request('/stocks', {}, backend), request('/ranking', {}, backend),
    request('/watchlist', {}, backend), request('/settings', {}, backend),
    request('/market/providers', {}, backend),
  ]);
  if (health.block !== 2 || !['dummy','jquants'].includes(health.mode) || !Array.isArray(stocks) || !Array.isArray(ranking) || !Array.isArray(watchlist) || !settings.theme || !Array.isArray(providers.providers)) {
    throw new Error('接続先がBLOCK 2 Backendの形式と一致しません。');
  }
  return {health, stocks, ranking, watchlist, settings, providers};
}

return {readBackend, normalizeBackend, saveBackend, request, loadFoundation};
})();

__modules.builtinMarket = (() => {
const PROXY='https://proxy.cors.dev/';
const SOURCE='Yahoo Finance Chart';
const jpCode=ticker=>{const t=String(ticker).toUpperCase().replace(/\.T$/,'');return t.length===5&&t.endsWith('0')?t.slice(0,4):t;};
const ySymbol=ticker=>jpCode(ticker)+'.T';
function tokyoDay(seconds){
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(seconds*1000));
  const obj=Object.fromEntries(parts.map(p=>[p.type,p.value]));return `${obj.year}-${obj.month}-${obj.day}`;
}
async function fetchJson(url,timeout=12000){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);
  try{const r=await window.stockEdgeRequest(url,{signal:controller.signal,credentials:'omit',cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}
  finally{clearTimeout(timer);}
}
async function yahooChart(ticker){
  const symbol=ySymbol(ticker),direct=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?range=2y&interval=1d&events=div%2Csplits&includePrePost=false`;
  const routes=[{name:'Yahoo direct',url:direct},{name:'cors.dev relay',url:PROXY+direct}];
  let lastError=null;
  for(const route of routes){
    try{
      const body=await fetchJson(route.url),result=body?.chart?.result?.[0];
      if(!result||body?.chart?.error)throw new Error(body?.chart?.error?.description||'株価データが空です。');
      const q=result.indicators?.quote?.[0],ts=result.timestamp||[];
      if(!q||!ts.length)throw new Error('OHLCVが見つかりません。');
      const rows=[];
      for(let i=0;i<ts.length;i++){
        const values=[q.open?.[i],q.high?.[i],q.low?.[i],q.close?.[i],q.volume?.[i]];
        if(values.some(v=>v==null||!Number.isFinite(Number(v))))continue;
        rows.push({date:tokyoDay(ts[i]),open:Number(values[0]),high:Number(values[1]),low:Number(values[2]),close:Number(values[3]),volume:Number(values[4])});
      }
      if(rows.length<20)throw new Error('有効な日足が少なすぎます。');
      return {rows,meta:result.meta||{},sourceUrl:direct,transport:route.name};
    }catch(error){lastError=error;}
  }
  throw new Error('標準株価ルートで取得できませんでした。通信環境または提供元の状態を確認してください。'+(lastError?.message?' ('+lastError.message+')':''));
}
async function fetchAndSave(ticker){
  const fetchedAt=new Date().toISOString(),payload=await yahooChart(ticker),meta=payload.meta||{};
  const expected=ySymbol(ticker).toUpperCase();
  if(meta.symbol&&String(meta.symbol).toUpperCase()!==expected)throw new Error('取得した銘柄コードを検証できません。');
  const record=__modules.dataEvidence.parsePrices(JSON.stringify(payload.rows),{ticker,market:'JP',company:meta.shortName||meta.longName||jpCode(ticker),provider:'yahoo',basis:'raw',source_url:payload.sourceUrl,file_name:'preinstalled-yahoo-chart.json'});
  record.stock.source=SOURCE;record.stock.provider_id='yahoo-browser';record.stock.fetched_at=fetchedAt;record.stock.updated_at=fetchedAt;record.stock.exchange=meta.exchangeName||'JPX';record.stock.currency=meta.currency||'JPY';
  record.provenance.provider='Yahoo Finance Chart (unofficial)';record.provenance.acquired_at=fetchedAt;record.provenance.transport=payload.transport;record.provenance.verification='Yahoo Financeの非公式Chartエンドポイントから自動取得。公式開示・取引所データとの照合は未実施。';
  workspace.saveRecord(record);return record;
}
return {fetchAndSave,yahooChart,jpCode,ySymbol,SOURCE};
})();

__modules.technicalEngine = (() => {
const clamp=(v,lo=0,hi=100)=>Math.max(lo,Math.min(hi,v));
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;

const ns = 'http://www.w3.org/2000/svg';
function el(name, attrs = {}, text = '') {

  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  if (text) node.textContent = text;

const fmt = value => new Intl.NumberFormat('ja-JP', {maximumFractionDigits: 2}).format(value);

function drawCandles(container, all, count = 60, meta = {}) {
  const data = all.slice(-count);
  container.replaceChildren();
  if (!data.length) { container.textContent = 'ローソク足データがありません。'; return; }
  const width = Math.max(container.clientWidth, 280);
  const height = 360, right = 66, left = 10, top = 28, bottom = 35;
  const plotW = width - right - left, plotH = 226;
  const offset=all.length-data.length;
  const chartPatternCandidate=meta.evidence;
  const pattern=chartPatternCandidate&&[chartPatternCandidate.a,chartPatternCandidate.b,chartPatternCandidate.n].every(i=>i>=offset)?chartPatternCandidate:null;
  const extra=pattern?[pattern.neckline,pattern.invalidation,pattern.target]:[];
  if(meta.showSMA)extra.push(...__modules.dataEvidence.sma(all,20).slice(offset).filter(p=>p.value!==null).map(p=>p.value));
  const min = Math.min(...data.map(d => d.low),...extra), max = Math.max(...data.map(d => d.high),...extra);
  const pad = Math.max((max - min) * .12, max * .005);
  const lo = min - pad, hi = max + pad;
  const y = price => top + (hi - price) / (hi - lo) * plotH;

function filterStocks(items) {
  const query = state.query.trim().toLowerCase();
  return items.filter(s=>`${s.ticker} ${s.company} ${s.sector}`.toLowerCase().includes(query))
    .sort((a,b)=>state.sort==='ticker'?a.ticker.localeCompare(b.ticker):state.sort==='risk'?(a.scores.risk??101)-(b.scores.risk??101):(b.scores.edge??-1)-(a.scores.edge??-1));
}
function n225Rows(){
  const q=state.query.trim().toLowerCase(),sort=state.n225Sort||'score';
  let rows=__modules.nikkei225.rows().filter(r=>!q||`${r.code} ${r.name} ${r.officialName||''} ${r.sector}`.toLowerCase().includes(q));
  const n=v=>Number.isFinite(v)?v:-Infinity;
  rows.sort((a,b)=>sort==='day'?n(b.changePct)-n(a.changePct):sort==='m20'?n(b.m20)-n(a.m20):sort==='volume'?n(b.volumeRatio)-n(a.volumeRatio):sort==='code'?a.code.localeCompare(b.code):n(b.score)-n(a.score));
  return rows;
}

function n225ReasonChips(r){
  const chips=[];
  if(Number.isFinite(r.m20))chips.push(`<span class="reason-chip ${r.m20>=5?'good':r.m20<0?'bad':''}">20日 ${r.m20>=0?'+':''}${r.m20.toFixed(1)}%</span>`);
  if(Number.isFinite(r.volumeRatio))chips.push(`<span class="reason-chip ${r.volumeRatio>=1.4?'good':r.volumeRatio<.75?'warn':''}">出来高 ${r.volumeRatio.toFixed(2)}×</span>`);
  if(Number.isFinite(r.rsi))chips.push(`<span class="reason-chip ${r.rsi>=45&&r.rsi<=68?'good':r.rsi>75?'warn':''}">RSI ${r.rsi.toFixed(0)}</span>`);
  if(Number.isFinite(r.m5))chips.push(`<span class="reason-chip ${r.m5>0?'good':r.m5<0?'bad':''}">5日 ${r.m5>=0?'+':''}${r.m5.toFixed(1)}%</span>`);
  return chips.slice(0,4).join('');
}
function n225CardNote(r){
  if(Number.isFinite(r.rsi)&&r.rsi>75)return 'RSI高め。勢いだけで追わず、チャート位置と押し目余地を確認。';
  if(Number.isFinite(r.volumeRatio)&&r.volumeRatio>=1.5)return '出来高増加が目立ちます。価格帯別の抵抗とブレイク継続を確認。';
  if(Number.isFinite(r.m20)&&r.m20>=5)return '20日トレンドが強め。SMA20/50との位置関係を詳細画面で確認。';
  return '合成スクリーニング点です。上位理由を分解してから詳細チャートへ進みます。';
}

const marketVoice = (()=>{
  const KEY='stock-edge-market-voice-v2-auto';
  const REMOTE_URL='data/market_intel.json';
  const SYNC_TTL=10*60*1000;
  const materialTypes=new Set(['ニュース','材料','決算','IR','EDINET','企業開示','適時開示']);
  let syncState={status:'idle',message:'自動収集データを確認します',lastAttempt:null};
  const defaultDb=()=>({schema:'market-voice-v2-auto',predictions:[],remoteMeta:null,lastClientSync:null});
  const read=()=>{try{const v=JSON.parse(HTML_CONTEXT.storage.getItem(KEY)||'null');return v&&v.schema==='market-voice-v2-auto'?{...defaultDb(),...v,predictions:[...(Array.isArray(v.predictions)?v.predictions:[]).filter(p=>!p.communityFeed),...StockEdgeCommunity.items()].map(p=>p.browserAuto?{...p,stance:EdgeModel.classify(p.headline||p.raw||'')}:p)}:{...defaultDb(),predictions:StockEdgeCommunity.items()};}catch{return {...defaultDb(),predictions:StockEdgeCommunity.items()};}};
  const write=db=>{HTML_CONTEXT.storage.setItem(KEY,JSON.stringify({...db,predictions:db.predictions.filter(p=>!p.communityFeed)}));metricMemo.clear();metricDbSnapshot=null;invalidateVoicePresentation();return db;};
  const rows=()=>__modules.nikkei225?.rows?.()||[];
  const codeOfTicker=t=>VoiceView.codeOf(t);
  const quote=code=>rows().find(r=>r.code===String(code));
  const remoteKey=p=>p.remoteId||p.id||`${p.code}|${p.url}|${p.publishedAt}`;
  const syncRemote=async(force=false)=>{
    const db=read();
    if(!force&&db.lastClientSync&&Date.now()-Date.parse(db.lastClientSync)<SYNC_TTL)return db;
    syncState={status:'loading',message:'自動収集JSONを同期しています…',lastAttempt:new Date().toISOString()};
    try{
      if(location.protocol==='file:'){syncState={status:'local',message:'ダウンロード版：保存済みの市場情報を使用',lastAttempt:new Date().toISOString()};db.lastClientSync=new Date().toISOString();write(db);return db;}
      const join=REMOTE_URL+(REMOTE_URL.includes('?')?'&':'?')+'v='+Date.now();
      const res=await window.stockEdgeRequest(join,{cache:'no-store',credentials:'omit'});
      if(!res.ok)throw new Error('自動収集データ HTTP '+res.status);
      const payload=await res.json();
      if(payload?.schema!=='stock-edge-market-intel-v1'||!Array.isArray(payload.items))throw new Error('自動収集JSONの形式が違います');
      const previous=new Map(db.predictions.filter(p=>p.remote).map(p=>[remoteKey(p),p]));
      const remote=payload.items.map(item=>{
        const old=previous.get(item.id),q=quote(item.code);
        return {id:item.id,remoteId:item.id,remote:true,code:String(item.code||''),company:item.company||String(item.code||''),stance:item.stance||'neutral',confidence:Number(item.confidence)||.5,targetPrice:Number.isFinite(Number(item.targetPrice))?Number(item.targetPrice):null,horizon:item.horizon||'期限未指定',deadline:item.deadline||null,reasons:Array.isArray(item.reasons)?item.reasons:[],raw:[item.headline,item.summary].filter(Boolean).join('。'),headline:item.headline||'',summary:item.summary||'',sourceType:item.sourceType||'ニュース',sourceCategory:item.sourceCategory||'material',opinionChannel:item.opinionChannel||((item.sourceCategory==='voice')?'analyst':'media'),lensId:item.lensId||'remote',author:item.author||item.publisher||item.source||'情報源',publisher:item.publisher||item.source||'',url:item.url||'',publishedAt:item.publishedAt||'',collectedAt:item.collectedAt||payload.generatedAt||'',createdAt:old?.createdAt||new Date().toISOString(),entryPrice:old?.entryPrice??(Number.isFinite(q?.price)?q.price:null),entryAsOf:old?.entryAsOf??q?.dataAsOf??null,outcome:old?.outcome||'open',outcomeAt:old?.outcomeAt||null,outcomePrice:old?.outcomePrice||null};
      });
      const legacy=db.predictions.filter(p=>!p.remote);
      db.predictions=[...remote,...legacy].slice(0,2000);db.remoteMeta={...(payload.meta||{}),generatedAt:payload.generatedAt||null,itemCount:payload.items.length,sourceCount:payload.sources?.length||0,sources:payload.sources||[],collector:payload.collector||'GitHub Actions'};db.lastClientSync=new Date().toISOString();write(db);

function v4Discoveries(rows){
  const usable=rows.filter(r=>Number.isFinite(r.score)); if(!usable.length)return [];
  const best=v4TopRows(usable,1)[0]?.r;
  const surge=[...usable].filter(r=>Number.isFinite(r.m5)).sort((a,b)=>b.m5-a.m5)[0];
  const volume=[...usable].filter(r=>Number.isFinite(r.volumeRatio)).sort((a,b)=>b.volumeRatio-a.volumeRatio)[0];
  const pullback=[...usable].filter(r=>Number.isFinite(r.m20)&&r.m20>2&&Number.isFinite(r.m5)&&r.m5<2&&Number.isFinite(r.rsi)&&r.rsi>=38&&r.rsi<=64).sort((a,b)=>b.score-a.score)[0];
  const divergence=[...usable].map(r=>({r,i:v4Insight(r)})).filter(x=>x.i.kind==='diverge').sort((a,b)=>(b.i.mv.voice.count+b.i.mv.material.count)-(a.i.mv.voice.count+a.i.mv.material.count))[0]?.r;
  return [
    ['本命候補',best,best?`総合 ${v4Insight(best).overall??best.score} · ${v4Insight(best).coverage}/3軸`:'' ],
    ['急上昇',surge,surge?`5日 ${surge.m5>=0?'+':''}${surge.m5.toFixed(1)}%`:'' ],
    ['押し目候補',pullback,pullback?`20日 +${pullback.m20.toFixed(1)}% / RSI ${pullback.rsi.toFixed(0)}`:'条件に合う銘柄なし'],
    ['出来高急増',volume,volume?`${volume.volumeRatio.toFixed(2)}×`:'' ],
    ['意見の逆行',divergence,divergence?v4Insight(divergence).signal:'市場情報待ち']
  ].map(([label,r,desc])=>({label,row:r,desc}));
}
function v4Themes(rows){
  const map=new Map();
  for(const r of rows){if(!Number.isFinite(r.score))continue;const k=r.sector||'その他',x=map.get(k)||{sector:k,n:0,score:0,m20:0,m20n:0};x.n++;x.score+=r.score;if(Number.isFinite(r.m20)){x.m20+=r.m20;x.m20n++;}map.set(k,x);}
  return [...map.values()].map(x=>({...x,avg:Math.round(x.score/x.n),m20avg:x.m20n?x.m20/x.m20n:null})).sort((a,b)=>b.avg-a.avg).slice(0,5);
}
function v4Signals(rows){return rows.filter(r=>Number.isFinite(r.score)).map(r=>({r,i:v4Insight(r)})).filter(x=>x.i.kind!=='neutral').sort((a,b)=>{const pri={triple:3,diverge:2,risk:1};return (pri[b.i.kind]||0)-(pri[a.i.kind]||0)||(b.i.overall??0)-(a.i.overall??0);}).slice(0,4);}

function v4LocalTime(v){

opener noreferrer">${esc(s.name)} ↗</a></h3><p>${esc(s.style)}</p><p>${s.status==='ok'?'RSS取得済み':s.status==='cached'?'取得失敗・保存記事あり':'取得失敗'} · 30日以内 ${count}件${s.latestAt?' · 最新 '+esc(voiceDate(s.latestAt)):''}</p>${s.error?`<p class="voice-story-quality">${esc(s.error)}</p>`:''}<button class="btn small" type="button" data-blog-show="${esc(s.id)}">この情報源の記事</button><a class="blog-rss-link" href="${esc(s.feed)}" target="_blank" rel="noopener noreferrer">RSS ↗</a></article>`;}).join('')}</div></details></section>`;

function voiceStory(p,{compact=false}={}){

function voiceResultsHtml(){const items=voiceScope(state.voiceCode||''),selected=VoiceView.select(items,{...voiceFilters,code:state.voiceCode||''});return {count:selected.length,html:selected.length?selected.slice(0,voiceFilters.limit).map(p=>voiceStory(p)).join('')+(selected.length>voiceFilters.limit?`<button class="btn voice-more-link" type="button" data-voice-more>さらに24件を表示（残り${selected.length-voiceFilters.limit}件）</button>`:''):voiceEmpty(state.voiceCode||'',items,{filtered:!!items.length})};}

 const code=state.voiceCode||'',items=voiceScope(code),db=marketVoice.read(),collector=db.collector||{},result=voiceResultsHtml(),running=window.__stockEdgeBg.intelRunning;
 return `<div class="v4-dashboard voice-reading-page"><header class="voice-reading-header"><span class="eyebrow">MARKET VOICE</span><h1>${code?esc(voiceCompany(code))+'の市場の声':'市場の声から、投資仮説へ'}</h1><p>意見の方向、見出し、媒体、公表日をまとめて確認できます。</p><div class="voice-panel-actions">${code?`<button class="btn primary" type="button" data-voice-refresh-code="${esc(code)}">この銘柄を優先取得</button><a class="btn" href="#/voice">全銘柄に戻る</a>`:'<button class="btn primary" type="button" data-market-intel-refresh>市場情報を取得</button>'}<a class="btn" href="${voiceSearchLink(code)}" target="_blank" rel="noopener noreferrer">公開記事を検索 ↗</a></div></header>${voiceResearchPanel(code)}${blogDiscoveryPanel()}<div data-voice-page-summary>${voiceSummary(items)}</div><div class="voice-page-status" role="status">${code?voiceStatusLine(code,items):`<span data-voice-collector-status>保存記事 ${items.length}件 · 最終検索 ${collector.lastAttemptAt?esc(voiceDate(collector.lastAttemptAt)):'未実行'}</span>`}<span data-mv-progress-text>${running?`${window.__stockEdgeBg.intelDone||0}/${window.__stockEdgeBg.intelTotal||0}検索中`:'保存済み情報を表示'}</span></div><section class="voice-reader"><h2>記事一覧${code?' · '+esc(code):''}</h2><p class="voice-evidence-note">意見を先に表示。個人ブログのみの表示では、著者ごとに新しい記事から分散して並べます。</p><label class="voice-search-label">銘柄名・コード・媒体で絞り込む<input id="voice-filter" type="search" value="${esc(voiceFilters.query)}" placeholder="例：7203、トヨタ、目標株価" autocomplete="off"></label><details class="voice-filter-options"><summary>種類・強弱・期間で絞り込む</summary><div data-voice-filter-buttons>${voiceFilterButtons()}</div></details><div class="voice-result-info"><strong data-voice-result-count aria-live="polite">${result.count}件</strong><button class="btn small" type="button" data-voice-reset>条件をリセット</button></div><div class="voice-new-message" data-voice-new hidden><button class="btn" type="button" data-voice-apply>新しい情報を表示</button></div><div id="voice-results" data-voice-signature="${voiceSignature(items)}">${result.html}</div></section><details class="voice-diagnostics"><summary>取得状況・失敗理由を見る</summary><p>最終取得経路：${esc(collector.lastRoute||'未取得')}。前回は${collector.lastScanned||0}銘柄を確認しました。</p><p>${esc((collector.lensErrors||[]).slice(0,12).join(' / ')||'前回の取得エラー記録なし')}</p><p>公開RSSの見出しと配信概要を使います。有料記事・ログイン必須SNSの本文は取得しません。記事が検索に載らない場合や通信制限がある場合は取得できません。</p></details></div>`;

function renderVoiceResults(){const box=document.getElementById('voice-results');if(!box)return;const result=voiceResultsHtml();box.innerHTML=result.html;box.dataset.voiceSignature=voiceSignature(voiceScope(state.voiceCode||''));const count=document.querySelector('[data-voice-result-count]');if(count)count.textContent=result.count+'件';document.querySelector('[data-voice-filter-buttons]').innerHTML=voiceFilterButtons();const sourceControl=document.querySelector('[data-blog-source]'),topicControl=document.querySelector('[data-blog-topic]');if(sourceControl)sourceControl.value=voiceFilters.source;if(topicControl)topicControl.value=voiceFilters.topic;document.querySelectorAll('[data-blog-shortcuts] [data-voice-kind]').forEach(b=>b.setAttribute('aria-pressed',String(voiceFilters.kind===b.dataset.voiceKind)));}
function refreshVisibleMarketVoice(force=false){
 if(state.loading)return;
 refreshResearchPanels(force);
 const axis=document.querySelector('.voice-axis-link');if(axis&&state.route==='stock'){const code=VoiceView.codeOf(state.ticker);axis.outerHTML=marketVoiceAxis(code,marketVoice.metrics(code));}
 document.querySelectorAll('[data-voice-job]').forEach(node=>{const code=node.dataset.voiceJob;node.outerHTML=voiceStatusLine(code,voiceScope(code));});
 if(state.route==='stock'){
  const panel=document.querySelector('[data-voice-stock-panel]');if(!panel)return;const code=panel.dataset.voiceStockPanel,items=voiceScope(code),signature=voiceSignature(items);
  const status=panel.querySelector('[data-voice-job]');if(status)status.outerHTML=voiceStatusLine(code,items);
  if(panel.dataset.voiceSignature===signature)return;
  const reading=(panel.querySelector('.voice-story-card')||panel.querySelector('details[open]'))&&panel.getBoundingClientRect().top<innerHeight&&panel.getBoundingClientRect().bottom>0;
  if(reading&&!force){const pending=panel.querySelector('[data-voice-new]');pending.hidden=false;pending.querySelector('button').textContent=items.filter(p=>p.fresh).length+'件の最新記事を表示';return;}
  panel.outerHTML=marketVoiceStockPanel(fastDetailStock());
 }else if(state.route==='voice'){
  const items=voiceScope(state.voiceCode||''),box=document.getElementById('voice-results');if(!box)return;
  const collectorStatus=document.querySelector('[data-voice-collector-status]');if(collectorStatus){const collector=marketVoice.read().collector||{};collectorStatus.textContent='保存記事 '+items.length+'件 · 最終検索 '+(collector.lastAttemptAt?voiceDate(collector.lastAttemptAt):'未実行');}
  const summary=document.querySelector('[data-voice-page-summary]');if(summary)summary.innerHTML=voiceSummary(items);
  if(box.dataset.voiceSignature===voiceSignature(items))return;
  if(!force&&(document.activeElement?.id==='voice-filter'||box.querySelector('.voice-story-card')&&box.getBoundingClientRect().top<innerHeight)){document.querySelector('[data-voice-new]').hidden=false;return;}
  renderVoiceResults();document.querySelector('[data-voice-new]').hidden=true;
 }
}
async function requestStockVoice(code){
 if(!__modules.nikkei225.UNIVERSE.some(r=>r.code===code)){toast('ランキングから実際の銘柄を選んでください。');return;}
 voicePriorityCodes.add(code);
 refreshVisibleMarketVoice();
 if(window.__stockEdgeBg.intelRunning){toast('収集中の処理が終わり次第、この銘柄を優先取得します。');refreshVisibleMarketVoice();scheduleVoice(500);return;}
 await collectBrowserMarketIntel(true,[code]);refreshVisibleMarketVoice(true);scheduleVoice(500);
}
app.addEventListener('click',async event=>{
 const b=event.target.closest('button');if(!b)return;
 if(b.hasAttribute('data-voice-refresh-code')){const code=b.dataset.voiceRefreshCode;b.disabled=true;try{await requestStockVoice(code);}catch(e){toast('取得できませんでした。取得状況をご確認ください。');}finally{b.disabled=false;}return;}
 if(b.hasAttribute('data-blog-sync')){b.disabled=true;try{await syncOriginalBlogs(true);}finally{b.disabled=false;}return;}
 if(b.hasAttribute('data-blog-show')){voiceFilters.source=b.dataset.blogShow;voiceFilters.kind='blog';voiceFilters.period='all';voiceFilters.limit=24;renderVoiceResults();const panel=document.querySelector('.blog-discovery');if(panel)panel.outerHTML=blogDiscoveryPanel();document.getElementById('voice-results')?.scrollIntoView({block:'start'});return;}
 if(b.hasAttribute('data-voice-apply')){refreshVisibleMarketVoice(true);return;}
 let filtered=false;
 if(b.hasAttribute('data-voice-kind')){voiceFilters.kind=b.dataset.voiceKind;if(voiceFilters.kind==='all'){voiceFilters.source='';voiceFilters.topic='all';}filtered=true;}
 if(b.hasAttribute('data-voice-stance')){voiceFilters.stance=b.dataset.voiceStance;filtered=true;}
 if(b.hasAttribute('data-voice-period')){voiceFilters.period=b.dataset.voicePeriod;filtered=true;}
 if(b.hasAttribute('data-voice-reset')){resetVoiceFilters();const input=document.getElementById('voice-filter');if(input)input.value='';filtered=true;}
 if(b.hasAttribute('data-voice-more')){voiceFilters.limit+=24;renderVoiceResults();return;}
 if(filtered){voiceFilters.limit=24;renderVoiceResults();}
});
app.addEventListener('input',event=>{if(event.target.id!=='voice-filter')return;voiceFilters.query=event.target.value;state.voiceFilter=event.target.value;voiceFilters.limit=24;renderVoiceResults();});

// Inside the app scope. Research notes and price conditions stay on this device.
const researchUi={filter:'all',query:'',limit:6,version:0,busy:new Set()};
const RESEARCH_NOTES='stock-edge-thesis-journal-v1',RESEARCH_QUOTES='stock-edge-thesis-quotes-v1';
let researchMemoKey='',researchMemo=[];
function researchStored(key){try{const value=JSON.parse(HTML_CONTEXT.storage.getItem(key)||'{}');return value&&typeof value==='object'&&!Array.isArray(value)?value:{};}catch{return {};}}
function researchNotes(){const v=researchStored(RESEARCH_NOTES);return Object.fromEntries(Object.entries(v).filter(([code,n])=>VoiceResearch.codeOf(code)&&n&&typeof n==='object').slice(0,60));}
function researchQuotes(){const cached=researchStored(RESEARCH_QUOTES);for(const row of __modules.nikkei225.rows()){if(!cached[row.code]||Date.parse(row.dataAsOf||0)>Date.parse(cached[row.code].dataAsOf||0))cached[row.code]=row;}return cached;}
function researchIdeas(){
 const key=[voiceUiVersion,StockEdgeCommunity.version,renderEpoch,researchUi.version,Math.floor(Date.now()/60000)].join(':');if(key===researchMemoKey)return researchMemo;
 const notes=researchNotes(),quotes=researchQuotes(),fundamentals={};
 for(const code of new Set([...voiceRecords().flatMap(p=>VoiceResearch.identity(p)?.code||[]),...Object.keys(notes)])){try{fundamentals[code]=financialIntel.analyze(code,quotes[code]?.price);}catch{}}
 researchMemo=VoiceResearch.build(voiceRecords(),{quotes,fundamentals,journal:notes});researchMemoKey=key;return researchMemo;
}
function researchClaimList(claims,empty){return claims.length?claims.slice(0,3).map(c=>`<li><span class="research-claim-kind">${esc(c.label)}</span><p>「${esc(c.excerpt)}」</p><a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.publisher)} · ${esc(voiceDate(c.date))} ↗</a><small>${esc(c.basis)} · 表現の自動抽出</small></li>`).join(''):`<li class="research-missing">${esc(empty)}</li>`;}
function researchCard(idea,{compact=false}={}){

ata-research-refresh="${esc(idea.code)}" ${busy?'disabled':''}>${busy?'照合データを取得中…':'株価・財務を更新して照合'}</button><p class="research-method-note">自動照合は東証の取得ルートを使用。取得できない市場・項目は未確認のまま表示します。</p></section><details class="research-tasks" ${compact?'':'open'}><summary>次に確認すること（${idea.tasks.length}件）</summary><ul>${idea.tasks.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details>${idea.note?`<div class="research-saved"><strong>自分の仮説：${esc(n.thesis||'理由をメモに追加してください')}</strong><p>見送る・撤回する条件：${esc(n.invalidation||'まだ決めていません')}</p><small>${({watch:'監視中',research:'調査中',verified:'自分で確認済み',rejected:'見送り'})[n.status]||'監視中'}${n.reviewAt?' · 見直し '+esc(n.reviewAt):''}${Number(n.priceCeiling)>0?' · 監視価格 ¥'+money(Number(n.priceCeiling))+'以下':''}</small></div>`:''}<details class="research-note-editor" data-research-editor="${esc(idea.code)}"><summary>${idea.note?'調査メモ・保存時の根拠を開く':'調べる理由・見送る条件をメモする'}</summary><form data-research-form="${esc(idea.code)}"><label>調べる理由・自分の仮説<textarea name="thesis" maxlength="800" rows="3" placeholder="例：利益率が改善するか。次の決算で営業利益と受注を確認する。">${esc(n.thesis||'')}</textarea></label><label>見送る・仮説を撤回する条件<textarea name="invalidation" maxlength="800" rows="3" placeholder="例：受注の減少、会社予想の下方修正など。">${esc(n.invalidation||'')}</textarea></label><div class="research-note-options"><label>状態<select name="status">${[['watch','監視中'],['research','調査中'],['verified','自分で確認済み'],['rejected','見送り']].map(([v,l])=>`<option value="${v}" ${n.status===v?'selected':''}>${l}</option>`).join('')}</select></label><label>見直す日<input name="reviewAt" type="date" value="${esc(n.reviewAt||'')}"></label><label>監視価格・円（任意）<input name="priceCeiling" type="number" min="0.01" step="any" inputmode="decimal" value="${Number(n.priceCeiling)>0?esc(n.priceCeiling):''}"></label></div><p>この端末だけに保存します。監視価格への到達は、あなたが設定した条件との一致を示します。</p><button class="btn primary" type="submit">仮説と根拠を保存</button><span role="status" data-research-save-status></span></form>${n.initialSavedAt?`<details class="research-original"><summary>初回保存時の根拠（${ }

function refreshResearchPanels(force=false){
 if(!['voice','stock'].includes(state.route))return;
 for(const panel of document.querySelectorAll('[data-research-panel]')){
  if(!force&&(panel.contains(document.activeElement)&&document.activeElement?.matches('input,textarea,select')||panel.querySelector('.research-analysis[open]')))continue;
  const code=panel.dataset.researchPanel,open=[...panel.querySelectorAll('.research-card')].map(card=>({code:card.dataset.researchCard,analysis:!!card.querySelector('.research-analysis[open]'),editor:!!card.querySelector('.research-note-editor[open]'),draft:card.querySelector('.research-note-editor[open] form')?Object.fromEntries(new FormData(card.querySelector('form'))):null}));
  panel.outerHTML=voiceResearchPanel(code,{compact:state.route==='stock'});
  for(const saved of open){const card=document.querySelector(`[data-research-panel="${code}"] [data-research-card="${saved.code}"]`);if(!card)continue;if(saved.analysis)card.querySelector('.research-analysis').open=true;if(saved.editor)card.querySelector('.research-note-editor').open=true;if(saved.draft)for(const [name,value] of Object.entries(saved.draft)){const input=card.querySelector('form').elements.namedItem(name);if(input)input.value=value;}}
 }
}
function saveResearchNote(code,patch={}){
 const idea=researchIdeas().find(i=>i.code===code);if(!idea)throw Error('仮説が見つかりません');const notes=researchNotes(),old=notes[code],quote=researchQuotes()[code],now=new Date().toISOString();
 if(!old&&Object.keys(notes).length>=60)throw Error('調査メモは60銘柄まで保存できます');
 notes[code]={...old,name:idea.name,thesis:String(patch.thesis??old?.thesis??'').slice(0,800),invalidation:String(patch.invalidation??old?.invalidation??'').slice(0,800),status:['watch','research','verified','rejected'].includes(patch.status)?patch.status:old?.status||'watch',reviewAt:patch.reviewAt!==undefined?(/^\d{4}-\d{2}-\d{2}$/.test(patch.reviewAt)?patch.reviewAt:''):old?.reviewAt||new Date(Date.now()+7*86400000+9*3600000).toISOString().slice(0,10),priceCeiling:patch.priceCeiling!==undefined?(Number(patch.priceCeiling)>0&&Number.isFinite(Number(patch.priceCeiling))?Number(patch.priceCeiling):null):old?.priceCeiling||null,savedAt:now,initialSavedAt:old?.initialSavedAt||now,initialPrice:old?(old.initialPrice??null):(idea.quoteFresh?quote.price:null),initialPriceDate:old?(old.initialPriceDate||null):(idea.quoteFresh?quote.dataAsOf:null),originalClaims:old?.originalClaims||idea.claims.slice(0,6)};
 HTML_CONTEXT.storage.setItem(RESEARCH_NOTES,JSON.stringify(notes));researchUi.version++;return notes[code];
}
async function refreshResearchCompany(code,{manual=true}={}){
 if(!VoiceResearch.codeOf(code)||researchUi.busy.has(code))return;
 researchUi.busy.add(code);if(manual)refreshResearchPanels();
 try{
  const results=await Promise.allSettled([(async()=>{const payload=await __modules.builtinMarket.yahooChart(code+'0');if(String(payload.meta?.symbol||'').toUpperCase()!==code+'.T'||payload.meta?.currency&&payload.meta.currency!=='JPY')throw Error('取得株価の銘柄コード・通貨が一致しません');const t=__modules.technicalEngine.analyze(payload.rows);if(!t)throw Error('日足不足');const quotes=researchStored(RESEARCH_QUOTES);quotes[code]={code,name:payload.meta.shortName||code,price:t.price,m20:t.m20,rsi:t.rsi,dataAsOf:t.dataAsOf,fetchedAt:new Date().toISOString(),symbol:payload.meta.symbol};const keep=Object.fromEntries(Object.entries(quotes).sort((a,b)=>String(b[1].fetchedAt).localeCompare(String(a[1].fetchedAt))).slice(0,60));HTML_CONTEXT.storage.setItem(RESEARCH_QUOTES,JSON.stringify(keep));})(),financialIntel.fetchOne(code,manual)]);
  if(results[0].status==='rejected'){const quotes=researchStored(RESEARCH_QUOTES),old=quotes[code]||{},failures=(old.retryFailures||0)+1;quotes[code]={...old,retryFailures:failures,retryAt:Date.now()+EdgeRefresh.retryDelay(failures)};HTML_CONTEXT.storage.setItem(RESEARCH_QUOTES,JSON.stringify(quotes));}
  if(manual)toast(results.every(r=>r.status==='fulfilled')?'株価・財務を更新しました。仮説と照合してください。':results.some(r=>r.status==='fulfilled')?'一部を更新しました。取得できない項目は未確認のまま表示します。':'取得できませんでした。保存済みの根拠を維持します。');
 }finally{researchUi.busy.delete(code);researchUi.version++;if(manual)refreshResearchPanels(true);}
}
async function refreshResearchWatch(){
 if(!refreshPolicy().active||document.hidden)return;
 const quotes=researchStored(RESEARCH_QUOTES),codes=Object.entries(researchNotes()).filter(([code,n])=>n.status!=='rejected'&&(quotes[code]?.retryAt||0)<=Date.now()&&Date.now()-Date.parse(quotes[code]?.fetchedAt||0)>30*60000).slice(0,2).map(([code])=>code);
 if(!codes.length)return;await EdgeRefresh.pool(codes,1,code=>refreshResearchCompany(code,{manual:false}),{shouldContinue:()=>refreshPolicy().active});refreshResearchPanels();
}
app.addEventListener('click',async event=>{
 const b=event.target.closest('button');if(!b)return;
 if(b.hasAttribute('data-research-filter')){researchUi.filter=b.dataset.researchFilter;researchUi.limit=6;refreshResearchPanels(true);return;}
 if(b.hasAttribute('data-research-more')){researchUi.limit+=6;refreshResearchPanels(true);return;}
 if(b.hasAttribute('data-research-refresh')){try{await refreshResearchCompany(b.dataset.researchRefresh);}catch{toast('照合データの更新に失敗しました。保存済みデータを表示します。');}return;}
 if(b.hasAttribute('data-research-follow')){const code=b.dataset.researchFollow;try{if(!researchNotes()[code])saveResearchNote(code);refreshResearchPanels(true);const editor=document.querySelector(`[data-research-editor="${code}"]`);if(editor){editor.closest('.research-analysis').open=true;editor.open=true;editor.scrollIntoView({block:'center'});}}catch(e){toast(e.message||'調査メモを保存できませんでした。');}}

function technicalLabPanel(){
  const t=__modules.technicalEngine.analyze(state.candles||[]);
  if(!t)return `<section class="tech-lab"><div class="tech-lab-head"><div><div class="eyebrow">TECHNICAL LAB</div><h2>テクニカル分析</h2><p>分析に必要な日足を読み込んでいます。</p></div></div></section>`;
  const catNames={trend:'TREND / トレンド',momentum:'MOMENTUM / 勢い',volume:'VOLUME / 資金流入',breakout:'BREAKOUT / 値幅',pattern:'PATTERN / 形状'};
  const shortNames={trend:'トレンド',momentum:'勢い',volume:'出来高',breakout:'ブレイク',pattern:'パターン'};
  const categoryCards=Object.entries(t.categories).map(([k,v])=>{const ss=t.signals.filter(x=>x.category===k),bull=ss.filter(x=>x.state==='bull').length,bear=ss.filter(x=>x.state==='bear').length;return `<div class="tech-cat"><span>${esc(shortNames[k])}</span><strong>${Number.isFinite(v)?v:'—'}</strong><small>↑${bull} / ↓${bear}</small></div>`;}).join('');

  const alerts=t.cautions.length?t.cautions.map(x=>`<span class="tech-alert">⚠ ${esc(x)}</span>`).join(''):'<span class="tech-count neutral">大きな過熱警告なし</span>';

      state.evidencePatterns=history.interval==='1d'?__modules.dataEvidence.doubleBottoms(history.candles):[];if(!state.evidencePatterns.some(p=>p.id===state.evidenceId))state.evidenceId=state.evidencePatterns[0]?.id||null;

      history.evidence=selectedPattern;history.showSMA=state.showSMA;
      app.innerHTML=shell(fastDetailPage(stock));paintBackgroundStatus();

      if (!container) return;
      const paint=()=>drawCandles(container,state.candles,state.range,state.history||{});

async function fetchFeedText(url,timeout=8000){

 if(feedInflight.has(url))return feedInflight.get(url);

  const host=new URL(url).host,local=location.hostname==='127.0.0.1'&&location.port==='8765';

  const preferred=feedTransport.get(host);routes.sort((a,b)=>Number(b.route===preferred)-Number(a.route===preferred));let last;
  for(const route of routes){const key=host+'|'+route.route;if((feedRouteRetry.get(key)||0)>Date.now())continue;

  }throw last||Error('RSS取得経路の再試行待ち');

      window.open(url,'_blank','noopener,noreferrer');
    }catch(error){dataError('import-status',error);}
  }
  if(button.dataset.action==='fetch-reference') {
    button.disabled=true;button.textContent='外部CSVを取得中…';const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
    try {
      const response=await window.stockEdgeRequest(__modules.dataEvidence.REFERENCE_URL,{signal:controller.signal,credentials:'omit',cache:'no-store',redirect:'error'});
      if(!response.ok)throw new Error('外部CSVの取得に失敗しました：HTTP '+response.status);
      const blob=await response.blob();if(blob.size>5*1024*1024)throw new Error('外部CSVが大きすぎます。');
      const record=__modules.dataEvidence.parsePrices(await blob.text(),{ticker:'AAPL',market:'US',company:'Apple / 公開過去データ',provider:'reference',basis:'raw',source_url:__modules.dataEvidence.REFERENCE_URL,file_name:'finance-charts-apple.csv'});
      if(state.route==='data'&&document.getElementById('import-preview'))showPriceDraft(record);
      else toast('画面が変わったため取得結果は保存していません。');
    }catch(error){dataError('import-status',error.name==='AbortError'?new Error('外部CSV取得がタイムアウトしました。保存データは変更していません。'):error);}
    finally{clearTimeout(timer);button.disabled=false;button.textContent='公開CSVを取得してプレビュー';}
  }
  if(button.dataset.action==='commit-price') {
    button.disabled=true;
    try {if(!priceDraft)throw new Error('先に株価データを検証してください。');const r=workspace.saveRecord(priceDraft);priceDraft=null;state.ticker=r.stock.ticker;state.basis=r.stock.available_bases.includes('adjusted')?'adjusted':r.stock.available_bases[0];state.range=60;state.evidenceId=null;await boot();location.hash='/stock/'+encodeURIComponent(r.stock.ticker);toast(readBackend()?'ファイル保存済み。表示には設定でBackend URLを空欄にしてください。':'外部データを保存しました');}catch(error){dataError('import-status',error);button.disabled=false;}
  }
  if(button.dataset.action==='commit-financial') {
    try {if(!financialDraft)throw new Error('先に財務データを検証してください。');const {ticker,rows}=financialDraft;workspace.saveFinancials(ticker,rows);financialDraft=null;await boot();location.hash='/stock/'+encodeURIComponent(ticker);toast('財務の数値と出典を保存しました');}catch(error){dataError('financial-status',error);}
  }
  if(button.dataset.openImport){try{workspace.setMode('imported');await boot();location.hash='/stock/'+encodeURIComponent(button.dataset.openImport);}catch(error){toast(error.message,true);}}
  if(button.dataset.mode){try{workspace.setMode(button.dataset.mode);state.evidenceId=null;state.query='';await boot();toast('表示データを切り替えました');}catch(error){toast(error.message,true);}}
  if(button.dataset.deleteImport){
    const ticker=button.dataset.deleteImport;
    if(!button.dataset.confirmDelete){button.dataset.confirmDelete='yes';button.textContent='この銘柄・財務を削除する';return;}
    try{workspace.remove(ticker);await boot();toast('取込銘柄とその財務を削除しました');}catch(error){toast(error.message,true);}
  }
  if(button.dataset.evidence){state.evidenceId=button.dataset.evidence;state.range=0;await render();document.getElementById('candlestick-chart')?.scrollIntoView({behavior:'smooth',block:'center'});}
  if(button.dataset.action==='download-evidence') {
    const svg=document.querySelector('#candlestick-chart svg');if(!svg){toast('チャート表示後に保存してください。',true);return;}
    const copied=svg.cloneNode(true);copied.setAttribute('xmlns','http://www.w3.org/2000/svg');
    // Resolve CSS variables so exported SVG stays readable outside this app.
    const css=getComputedStyle(document.documentElement);
    const vars=['--up','--down','--accent','--accent-text','--panel','--text','--line','--muted'];
    for(const node of [copied,...copied.querySelectorAll('*')])for(const attribute of [...node.attributes]){let value=attribute.value;for(const key of vars)value=value.replaceAll('var('+key+')',css.getPropertyValue(key).trim());node.setAttribute(attribute.name,value);}
    const background=document.createElementNS('http://www.w3.org/2000/svg','rect');background.setAttribute('width','100%');background.setAttribute('height','100%');background.setAttribute('fill',css.getPropertyValue('--panel').trim());copied.prepend(background);
    const style=document.createElementNS('http://www.w3.org/2000/svg','style');style.textContent='.chart-label{font-size:10px;fill:'+css.getPropertyValue('--muted').trim()+'}.chart-grid{stroke:'+css.getPropertyValue('--line').trim()+';stroke-width:1}.evidence-overlay-label{font: bold 11px sans-serif;paint-order:stroke;stroke:'+css.getPropertyValue('--panel').trim()+';stroke-width:4;stroke-linejoin:round}.crosshair{display:none}';copied.prepend(style);
    const desc=document.createElementNS('http://www.w3.org/2000/svg','desc');desc.textContent=__modules.evidenceUI.aiPrompt(state.history,state.evidencePatterns||[],state.evidenceId);copied.append(desc);
    const serialized=new XMLSerializer().serializeToString(copied);
    downloadText(serialized,state.history.ticker+'_'+state.history.data_as_of+'_evidence.svg','image/svg+xml;charset=utf-8');
    const fallback=document.getElementById('svg-export-code');if(fallback){fallback.innerHTML='<details><summary>SVGコードを見る（ダウンロードできない場合）</summary><textarea rows="8" readonly aria-label="SVGコード"></textarea></details>';fallback.querySelector('textarea').value=serialized;}
    toast('SVGのダウンロードを開始しました。保存できない場合はSVGコードを利用できます');
  }
  if(button.dataset.action==='copy-evidence') {
    const target=document.getElementById('evidence-prompt');if(!target||!state.history)return;
    const text=__modules.evidenceUI.aiPrompt(state.history,state.evidencePatterns||[],state.evidenceId);
    target.innerHTML='<label class="form-label">AIへ渡す根拠・描画指示（自動送信しません）<textarea rows="12" readonly aria-label="AI相談用の根拠"></textarea></label><p class="setting-note">必要なら本文を選択してコピーしてください。元資料を確認してから利用してください。</p>';
    target.querySelector('textarea').value=text;target.querySelector('textarea').focus();target.querySelector('textarea').select();
  }
});

const guideStore=__modules.guidedRefresh.createGuideStore(HTML_CONTEXT.storage);
let builtInRefreshBusy=false;
function repaintJob(job) {
  const panel=document.getElementById('guide-job-panel');if(panel)panel.innerHTML=__modules.guideUI.jobPanel(job,refreshJob.isRunning());
  document.querySelectorAll('[data-guide="start"]').forEach(b=>{const m=__modules.guideUI.guideModel(state.data,guideStore.read(),readBackend());b.disabled=refreshJob.isRunning()||builtInRefreshBusy||!m.apiReady||!guideStore.read().targets.length;});
}
const refreshJob=__modules.guidedRefresh.createRefreshJob({request,store:guideStore,onChange:repaintJob,onFinish:async()=>{await boot();}});

async function startBuiltinRefresh(targets){
  if(builtInRefreshBusy||refreshJob.isRunning())throw new Error('別の更新処理を実行中です。');
  if(!targets?.length)throw new Error('先に銘柄コードを登録してください。');
  builtInRefreshBusy=true;
  const now=()=>new Date().toISOString();
  const job={version:2,status:'running',message:'標準株価ルートから取得を開始します。',items:targets.map(t=>({ticker:t,status:'pending',message:'待機'})),created_at:now(),updated_at:now(),backend:'builtin'};
  const emit=()=>{job.updated_at=now();guideStore.saveJob(job);const panel=document.getElementById('guide-job-panel');if(panel)panel.innerHTML=__modules.guideUI.jobPanel(job,false);document.querySelectorAll('[data-guide="start"]').forEach(b=>b.disabled=true);};
  try{
    saveBackend('');emit();
    for(const item of job.items){
      item.status='running';item.message='日足を取得中';job.message=(item.ticker.endsWith('0')?item.ticker.slice(0,4):item.ticker)+' を取得しています…';emit();
      try{
        const record=await __modules.builtinMarket.fetchAndSave(item.ticker);item.status='success';item.company=record.stock.company;item.as_of=record.stock.data_as_of;item.fetched_at=record.provenance.acquired_at;item.message='保存済み';
      }catch(error){item.status='failed';item.message=error.message;}
      emit();
      // Be gentle to the upstream service when several symbols are requested.
      await new Promise(r=>setTimeout(r,350));
    }
    const failed=job.items.filter(i=>i.status==='failed').length,success=job.items.filter(i=>i.status==='success').length;
    job.status=failed?(success?'partial':'blocked'):'completed';job.completed_at=now();job.message=failed?(success?'一部の銘柄を取得できませんでした。取得済みデータは保存されています。':'取得できませんでした。通信環境または標準取得ルートを確認してください。'):'登録した銘柄を更新しました。根拠を見るへ進んでください。';emit();
    await boot();
  }finally{builtInRefreshBusy=false;const m=__modules.guideUI.guideModel(state.data,guideStore.read(),readBackend());document.querySelectorAll('[data-guide="start"]').forEach(b=>b.disabled=!m.apiReady||!guideStore.read().targets.length);}
}
function guideStatus(message,error=false) {const target=document.getElementById('guide-global-status');if(target){target.textContent=message;target.className=error?'guide-connect-error':'guide-note';}toast(message,error);}
let guidedReferenceBusy=false;
async function startReference() {
  if(guidedReferenceBusy)return;
  if(refreshJob.isRunning()){guideStatus('日本株の更新を一時停止してから、お試しを開始してください。',true);return;}
  guidedReferenceBusy=true;
  document.querySelectorAll('[data-guide="reference"]').forEach(b=>b.disabled=true);
  const message=document.getElementById('guide-reference-status');if(message)message.textContent='外部サイトから過去の株価を取得しています…';
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
  try {
    const previous=workspace.read().records.AAPL;
    if(previous&&previous.stock.source!=='FILE_REFERENCE')throw new Error('AAPLの保存済みデータがあります。お試しでは上書きしません。「ファイルを読み込む」の保存一覧から開いてください。');
    const response=await window.stockEdgeRequest(__modules.dataEvidence.REFERENCE_URL,{signal:controller.signal,credentials:'omit',cache:'no-store',redirect:'error'});
    if(!response.ok)throw new Error('外部CSVを取得できませんでした（HTTP '+response.status+'）。時間を置いて再試行してください。');
    const blob=await response.blob();if(blob.size>5*1024*1024)throw new Error('外部CSVのサイズが上限を超えています。');
    const record=__modules.dataEvidence.parsePrices(await blob.text(),{ticker:'AAPL',market:'US',company:'Apple / 公開過去データ',provider:'reference',basis:'raw',source_url:__modules.dataEvidence.REFERENCE_URL,file_name:'finance-charts-apple.csv'});
    record.provenance.acquired_at=new Date().toISOString();record.stock.fetched_at=record.provenance.acquired_at;
    workspace.saveRecord(record);
    if(readBackend())guideStore.rememberBackend(readBackend());
    saveBackend('');state.ticker=record.stock.ticker;state.basis='raw';state.range=60;state.query='';state.evidenceId=null;
    await boot();location.hash='/stock/'+encodeURIComponent(record.stock.ticker);toast('過去データを取得・保存しました。図の見方を確認してみましょう');
  }catch(error){
    const text=error.name==='AbortError'?'取得がタイムアウトしました。前回の保存データは残しています。':error.message;
    const target=document.getElementById('guide-reference-status');if(target){target.textContent=text;target.className='guide-connect-error';}guideStatus(text,true);
  }finally{clearTimeout(timer);guidedReferenceBusy=false;document.querySelectorAll('[data-guide="reference"]').forEach(b=>b.disabled=false);}
}
app.addEventListener('submit',async event=>{
  if(event.target.id==='guide-connect-form') {
    event.preventDefault();const form=event.target,button=form.querySelector('[type=submit]'),status=document.getElementById('guide-connect-status');
    if(refreshJob.isRunning()){guideStatus('更新中は接続先を変更できません。一時停止または中止してください。',true);return;}
    button.disabled=true;status.textContent='取得先とAPIキーの設定状態を確認しています…';
    try {
      const backend=normalizeBackend(form.elements.backend.value);
      const {provider}=await __modules.guidedRefresh.probeBackend(request,backend);
      await request('/settings',{method:'PATCH',body:JSON.stringify({market_data_provider:'jquants'})},backend);
      await loadFoundation(backend);
      guideStore.rememberBackend(backend);saveBackend(backend);state.guideConnectionNote='接続できました。'+(provider.plan==='free'?'Freeは12週間遅延です。':'株価の基準日を確認してください。');
      await boot();toast('接続できました。次は②で銘柄を登録します');
      document.getElementById('guide-targets-form')?.scrollIntoView({behavior:'smooth',block:'center'});
    }catch(error){const message=error.status===404?'このURLに株価取得サーバーが見つかりません。GitHub Pagesの公開URLではなく、BackendのURLを入力してください。URLがなければ下の案内から過去データを試せます。':error.message;const current=document.getElementById('guide-connect-status');if(current){current.textContent=message;current.className='guide-connect-error';}guideStatus(message,true);}
    finally{button.disabled=false;}
  }
  if(event.target.id==='guide-targets-form') {
    event.preventDefault();
    try {
      if(refreshJob.isRunning())throw new Error('更新中は銘柄を変更できません。');
      guideStore.setTargets(event.target.elements.targets.value);await render();toast('銘柄を登録しました。次は更新して分析します');
      document.querySelector('[data-guide="start"]')?.scrollIntoView({behavior:'smooth',block:'center'});
    }catch(error){const el=document.getElementById('guide-target-status');if(el){el.textContent=error.message;el.className='guide-connect-error';}guideStatus(error.message,true);}
  }
});
// Keep the connection fixed while a foreground job is using it.
app.addEventListener('submit',event=>{if(event.target.id==='settings-form'&&refreshJob.isRunning()){event.preventDefault();event.stopImmediatePropagation();guideStatus('更新中は接続設定を変更できません。一時停止または中止してください。',true);}},true);
app.addEventListener('click',event=>{if(event.target.closest('[data-action="reset-connection"]')&&refreshJob.isRunning()){event.preventDefault();event.stopImmediatePropagation();guideStatus('更新を止めてから接続先を変更してください。',true);}},true);
app.addEventListener('click',async event=>{
  const button=event.target.closest('button');if(!button)return;
  if(button.dataset.guideScroll) {
    const allowed=['candlestick-chart','technical-evidence','data-provenance'];
    if(allowed.includes(button.dataset.guideScroll))document.getElementById(button.dataset.guideScroll)?.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  try {
    switch(button.dataset.guide) {
      case 'reference':await startReference();break;
      case 'local':if(refreshJob.isRunning())throw new Error('更新を止めてから接続先を変更してください。');if(readBackend())guideStore.rememberBackend(readBackend());saveBackend('');await boot();break;
      case 'start':if(readBackend())await refreshJob.start(readBackend(),guideStore.read().targets);else await startBuiltinRefresh(guideStore.read().targets);break;
      case 'pause':refreshJob.pause();break;
      case 'cancel':refreshJob.cancel();break;
      case 'resume':await refreshJob.resume(readBackend());break;
      case 'retry':if(readBackend())await refreshJob.retry(readBackend());else {const j=guideStore.read().job;await startBuiltinRefresh((j?.items||[]).filter(i=>i.status==='failed').map(i=>i.ticker));}break;
    }
  }catch(error){guideStatus(error.message,true);}
});

window.addEventListener('unhandledrejection',event=>{
  const reason=event.reason;
  const msg=reason?.message||String(reason||'');
  if(/ReferenceError|is not defined/i.test(msg)){
    console.error('[STOCK EDGE unhandled]',reason);
    event.preventDefault();
    toast('一部表示を再計算しました。保存済みデータで続けます。');
  }
});

boot();
// 財務は起動をブロックしない。保存済み画面を先に出し、上位候補だけ静かに差分更新する。
setTimeout(async()=>{
  try{
    if(!refreshPolicy().active||state.route!=='home')return;
    const rows=__modules.nikkei225.rows().filter(r=>Number.isFinite(r.score)).sort((a,b)=>(b.score||0)-(a.score||0));
    const missing=rows.filter(r=>!financialIntel.cached(r.code)).slice(0,2).map(r=>r.code);
    if(missing.length){await financialIntel.refreshBatch(missing,{force:false,limit:2,concurrency:1});if(state.route==='home')queueRefreshPaint();}
  }catch(e){console.warn('[FINANCIAL warmup]',e?.message||e);}
},60000);

})();
})();

</script>
